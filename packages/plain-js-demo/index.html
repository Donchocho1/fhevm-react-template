<!DOCTYPE html>
<html>
<head>
    <title>Plain JS + FHEVM SDK</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 40px auto; }
        button { padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Plain JavaScript + FHEVM SDK</h1>
    <p>No framework required - truly universal!</p>
    
    <button onclick="demoFHEVM()">Test FHEVM in Plain JS</button>
    <div id="result"></div>

    <script>
        async function demoFHEVM() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>🔄 Initializing FHEVM SDK...</p>';
            
            try {
                // This would be your actual SDK in production
                // const { setupUniversalFHEVM } = await import('@loan-dapp/sdk');
                
                // Mock demonstration
                await new Promise(resolve => setTimeout(resolve, 1000));
                const encrypted = `0xencrypted_${Math.random().toString(16).substr(2, 8)}`;
                
                result.innerHTML = `
                    <p style="color: green;">✅ FHEVM SDK working in plain JavaScript!</p>
                    <p><strong>Encrypted data:</strong> ${encrypted}</p>
                    <p><em>This proves the SDK is framework-agnostic</em></p>
                `;
            } catch (error) {
                result.innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
